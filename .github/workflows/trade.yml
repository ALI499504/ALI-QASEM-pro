name: MT5 Gold AI Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  trade:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install MetaTrader5 pandas pandas-ta requests
    - name: Download MT5
      run: |
        Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/11163/mt5/mt5setup.exe" -OutFile mt5setup.exe
        Start-Process -FilePath mt5setup.exe -ArgumentList "/S" -Wait
        Start-Sleep -Seconds 30
      shell: pwsh
    - name: Run Bot
      env:
        MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
        MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        MT5_SERVER: ${{ secrets.MT5_SERVER }}
      run: python src/bot.py
      shell: pwsh
