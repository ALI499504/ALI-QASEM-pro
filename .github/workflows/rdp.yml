name: Windows RDP with MT5
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Install ngrok
      run: choco install ngrok -y
      shell: pwsh

    - name: Configure ngrok
      run: ngrok authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      shell: pwsh

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name fDenyTSConnections -value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $pw = ConvertTo-SecureString -String $env:RDP_PASSWORD -AsPlainText -Force
        $user = New-LocalUser -Name "runner" -Password $pw -FullName "Runner" -Description "RDP"
        Add-LocalGroupMember -Group "Administrators" -Member "runner"
        Write-Host "User created: $($user.Name)"
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      shell: pwsh

    - name: Start tunnel
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"
        Start-Sleep 15
        $r = Invoke-WebRequest "http://localhost:4040/api/tunnels" -UseBasicParsing
        $t = ($r.Content | ConvertFrom-Json).tunnels[0].public_url
        Write-Host "=============================="
        Write-Host "RDP: $t"
        Write-Host "User: runner"
        Write-Host "Pass: $env:RDP_PASSWORD"
        Write-Host "=============================="
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      shell: pwsh

    - name: Keep alive
      run: |
        Write-Host "Install MT5 from metatrader5.com"
        Write-Host "Login: 49877585"
        $end = (Get-Date).AddHours(5.5)
        while ((Get-Date) -lt $end) { Start-Sleep 300 }
      shell: pwsh
