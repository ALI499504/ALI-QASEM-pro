name: Windows RDP with MT5
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Install ngrok
      run: choco install ngrok -y
      shell: pwsh
    - name: Configure ngrok
      run: ngrok authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      shell: pwsh
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name fDenyTSConnections -value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $pw = ConvertTo-SecureString -String $env:RDP_PASSWORD -AsPlainText -Force
        New-LocalUser -Name "runner" -Password $pw -FullName "Runner" -Description "RDP" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "runner" -ErrorAction SilentlyContinue
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      shell: pwsh
    - name: Start ngrok with retry
      run: |
        $ngrokPath = (Get-Command ngrok).Source
        Start-Job -ScriptBlock { param($p) & $p tcp 3389 --log=stdout } -ArgumentList $ngrokPath
        $tunnelUrl = $null
        for ($i = 0; $i -lt 12; $i++) {
          Start-Sleep 5
          try {
            $r = Invoke-WebRequest "http://localhost:4040/api/tunnels" -UseBasicParsing -TimeoutSec 5
            $t = ($r.Content | ConvertFrom-Json).tunnels
            if ($t.Count -gt 0) { $tunnelUrl = $t[0].public_url; break }
          } catch { Write-Host "Waiting for ngrok... ($($i+1)/12)" }
        }
        if ($tunnelUrl) {
          Write-Host "=============================="
          Write-Host "RDP: $tunnelUrl"
          Write-Host "User: runner"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host "=============================="
        } else {
          Write-Host "ngrok failed - check auth token"
        }
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      shell: pwsh
    - name: Keep alive
      run: |
        Write-Host "Install MT5 from metatrader5.com"
        Write-Host "Login: 49877585 / Server: HFMarketsGlobal-Demo"
        $end = (Get-Date).AddHours(5.5)
        while ((Get-Date) -lt $end) { Start-Sleep 300 }
      shell: pwsh
