name: Windows RDP with MT5
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Install ngrok
      run: choco install ngrok -y
      shell: pwsh

    - name: Configure ngrok
      run: ngrok authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      shell: pwsh

    - name: Enable RDP and create user
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name fDenyTSConnections -value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $pw = ConvertTo-SecureString -String $env:RDP_PASSWORD -AsPlainText -Force
        New-LocalUser -Name "runner" -Password $pw -FullName "Runner" -Description "RDP User" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "runner" -ErrorAction SilentlyContinue
        Set-LocalUser -Name "runner" -PasswordNeverExpires $true
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      shell: pwsh

    - name: Start tunnel
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"
        Start-Sleep 15
        $r = Invoke-WebRequest "http://localhost:4040/api/tunnels" -UseBasicParsing
        $t = ($r.Content | ConvertFrom-Json).tunnels[0].public_url
        Write-Host "=============================="
        Write-Host "RDP ADDRESS: $t"
        Write-Host "USERNAME: runner"
        Write-Host "PASSWORD: $env:RDP_PASSWORD"
        Write-Host "=============================="
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      shell: pwsh

    - name: Keep alive
      run: |
        Write-Host "=============================="
        Write-Host "RDP is LIVE!"
        Write-Host "Install MT5 from metatrader5.com"
        Write-Host "Login: 49877585"
        Write-Host "Server: HFMarketsGlobal-Demo"
        Write-Host "=============================="
        $end = (Get-Date).AddHours(5.5)
        while ((Get-Date) -lt $end) {
          $remaining = [math]::Round(($end - (Get-Date)).TotalMinutes)
          Write-Host "Active: $remaining min remaining"
          Start-Sleep 300
        }
      shell: pwsh
